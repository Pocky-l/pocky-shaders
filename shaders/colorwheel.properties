# Colorwheel: Flywheel instances (Create contraptions, ...) drawn through clrwl_gbuffers / clrwl_shadow.
# Translucent instances use order independent transparency: the lit colour (colortex0) blends by depth, the
# normal/material data (colortex1) and the shadow tint keep the front-most surface, like the rest of the pack.

oit = true

oit.gbuffers.coefficientRanks = 3

oit.gbuffers.colortex0 = 0

oit.gbuffers.colortex1 = frontmost
oit.gbuffers.colortex1.format = RGBA16

oit.shadow.shadowcolor0 = frontmost
oit.shadow.shadowcolor0.format = RGBA8
