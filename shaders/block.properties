# Block ids for mc_Entity (see lib/common.glsl), for every Minecraft version the pack runs on: names a version does
# not have are skipped (grass is the plant before 1.20.3, short_grass after). Blocks of other mods join through
# block tags where Iris supports them (IRIS_TAG_SUPPORT; older Iris and Oculus would fail on a % entry); a block
# listed by name wins over a tag.

