# Pocky Shaders - pack settings for Iris.

# Vanilla features the pack replaces or does not want.
clouds = off
sun = true
moon = true
oldLighting = false
oldHandLight = false
underwaterOverlay = false
vignette = false
separateAo = true
dynamicHandLight = true
rain.depth = false
beacon.beam.depth = true
particles.before.deferred = false
frustum.culling = true

# 1 while it snows at the camera (biome_precipitation 2) instead of raining: storms turn into bright blizzards.
uniform.float snowWeather = smooth(if(biome_precipitation == 2, 1.0, 0.0), 6, 6)

# 1 in swamps, 0.6 at rivers (Iris biome categories: 13 = RIVER, 14 = SWAMP): ground mist covers them.
uniform.float mistBiome = smooth(if(biome_category == 14, 1.0, if(biome_category == 13, 0.6, 0.0)), 8, 8)

# The weather of the author's mods: Petrichor, Hoarfrost and Rustling Leaves each publish a row of float texels every
# frame while a shader pack is on (docs/shader-data.md); see lib/modweather.glsl. A missing mod leaves Iris' missing
# texture there, which the pack tells apart by a marker.
customTexture.petrichorData = petrichor:shader_data
customTexture.hoarfrostData = hoarfrost:shader_data
customTexture.leavesData = rustling_leaves:shader_data

# The game's own cloud texture (resource packs can change it): the pack's clouds follow its shapes.
customTexture.cloudtex = minecraft:textures/environment/clouds.png

shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true
shadowPlayer = true
dhShadow.enabled = true
# Cull shadow casters by distance only. The default (advanced) culling keeps only chunks it predicts can shade the
# view, and while turning the camera in a forest it dropped the casters: all shadows vanished for some angles.
shadow.culling = false

# Translucent terrain: premultiplied colour into colortex3; colortex4 only keeps water pixels (alpha 1).
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.dh_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Particles, rain and snow: premultiplied colour into colortex8, laid over the scene in composite.
blend.gbuffers_textured = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Opaque programs fully replace their gbuffer data.
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.dh_terrain = off

# Quality presets (the Profile button in the shader options).
profile.LOW = QUALITY=0 shadowMapResolution=1536 shadowDistance=128.0 !SSAO !COLORED_SHADOWS !LIGHT_SHAFTS !FOLIAGE_TRANSLUCENCY CLOUDS=1 WATER_REFLECTIONS=1 !VALLEY_MIST
profile.MEDIUM = QUALITY=1 shadowMapResolution=2048 shadowDistance=192.0 SSAO COLORED_SHADOWS LIGHT_SHAFTS FOLIAGE_TRANSLUCENCY CLOUDS=2 WATER_REFLECTIONS=2 VALLEY_MIST
profile.HIGH = QUALITY=2 shadowMapResolution=3072 shadowDistance=256.0 SSAO COLORED_SHADOWS LIGHT_SHAFTS FOLIAGE_TRANSLUCENCY CLOUDS=2 WATER_REFLECTIONS=2 VALLEY_MIST
profile.ULTRA = QUALITY=3 shadowMapResolution=4096 shadowDistance=384.0 SSAO COLORED_SHADOWS LIGHT_SHAFTS FOLIAGE_TRANSLUCENCY CLOUDS=2 WATER_REFLECTIONS=2 VALLEY_MIST

# Option menu.
screen = <profile> QUALITY <empty> <empty> [LIGHTING] [NATURE] [WATER] [SKY] [WEATHER] [POST] [DEBUG]
screen.LIGHTING = SHADOWS COLORED_SHADOWS shadowMapResolution shadowDistance SHADOW_STYLE SHADOW_SOFTNESS SHADOW_LIGHT sunPathRotation SSAO SSAO_STRENGTH SURFACE_SHEEN HANDHELD_LIGHT BLOCK_LIGHT_WARMTH AMBIENT_MIN LIGHT_RESPONSE
screen.NATURE = WAVING_PLANTS WAVING_LEAVES WIND_STRENGTH FOLIAGE_TRANSLUCENCY
screen.WATER = WATER_REFLECTIONS WATER_REFRACTION WATER_WAVE_STRENGTH WATER_CLARITY WATER_CAUSTICS WATER_FOAM
screen.SKY = CLOUDS CLOUD_COVERAGE CLOUD_SIZE CLOUD_HEIGHT LIGHT_SHAFTS LIGHT_SHAFT_STRENGTH FOG_DENSITY VALLEY_MIST LOW_HAZE FAR_HAZE
screen.WEATHER = MOD_WEATHER WEATHER_GRADING RAINBOWS SNOW_SPARKLE WET_SURFACES
screen.POST = BLOOM BLOOM_STRENGTH LENS_FLARE LENS_FLARE_STRENGTH EXPOSURE SATURATION WARMTH FXAA
screen.DEBUG = DEBUG_VIEW
sliders = shadowMapResolution shadowDistance SHADOW_STYLE SHADOW_SOFTNESS SHADOW_LIGHT sunPathRotation SSAO_STRENGTH BLOCK_LIGHT_WARMTH AMBIENT_MIN LIGHT_RESPONSE WIND_STRENGTH WATER_WAVE_STRENGTH WATER_CLARITY CLOUD_COVERAGE CLOUD_SIZE CLOUD_HEIGHT LIGHT_SHAFT_STRENGTH FOG_DENSITY LOW_HAZE FAR_HAZE BLOOM_STRENGTH LENS_FLARE_STRENGTH EXPOSURE SATURATION WARMTH
