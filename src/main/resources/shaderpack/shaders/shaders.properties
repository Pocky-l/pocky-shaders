# Pocky Shaders - pack settings for Iris.

# Vanilla features the pack replaces or does not want.
clouds = off
sun = true
moon = true
oldLighting = false
oldHandLight = false
underwaterOverlay = false
vignette = false
separateAo = true
dynamicHandLight = true
rain.depth = false
beacon.beam.depth = true
particles.before.deferred = false
frustum.culling = true

# The game's own cloud texture (resource packs can change it): the pack's clouds follow its shapes.
customTexture.cloudtex = minecraft:textures/environment/clouds.png

shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true
shadowPlayer = true
dhShadow.enabled = true
# Cull shadow casters by distance only. The default (advanced) culling keeps only chunks it predicts can shade the
# view, and while turning the camera in a forest it dropped the casters: all shadows vanished for some angles.
shadow.culling = false

# Translucent terrain: premultiplied colour into colortex3; colortex4 only keeps water pixels (alpha 1).
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.dh_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Opaque programs fully replace their gbuffer data.
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.dh_terrain = off

# Quality presets (the Profile button in the shader options).
profile.LOW = QUALITY=0 shadowMapResolution=1536 shadowDistance=128.0 !SSAO !COLORED_SHADOWS !LIGHT_SHAFTS !FOLIAGE_TRANSLUCENCY CLOUDS=1 WATER_REFLECTIONS=1 !VALLEY_MIST
profile.MEDIUM = QUALITY=1 shadowMapResolution=2048 shadowDistance=192.0 SSAO COLORED_SHADOWS LIGHT_SHAFTS FOLIAGE_TRANSLUCENCY CLOUDS=2 WATER_REFLECTIONS=2 VALLEY_MIST
profile.HIGH = QUALITY=2 shadowMapResolution=3072 shadowDistance=256.0 SSAO COLORED_SHADOWS LIGHT_SHAFTS FOLIAGE_TRANSLUCENCY CLOUDS=2 WATER_REFLECTIONS=2 VALLEY_MIST
profile.ULTRA = QUALITY=3 shadowMapResolution=4096 shadowDistance=384.0 SSAO COLORED_SHADOWS LIGHT_SHAFTS FOLIAGE_TRANSLUCENCY CLOUDS=2 WATER_REFLECTIONS=2 VALLEY_MIST

# Option menu.
screen = <profile> QUALITY <empty> <empty> [LIGHTING] [NATURE] [WATER] [SKY] [POST] [DEBUG]
screen.LIGHTING = SHADOWS COLORED_SHADOWS shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation SSAO SSAO_STRENGTH SURFACE_SHEEN HANDHELD_LIGHT BLOCK_LIGHT_WARMTH AMBIENT_MIN
screen.NATURE = WAVING_PLANTS WAVING_LEAVES WIND_STRENGTH FOLIAGE_TRANSLUCENCY WET_SURFACES
screen.WATER = WATER_REFLECTIONS WATER_REFRACTION WATER_WAVE_STRENGTH WATER_CLARITY WATER_CAUSTICS WATER_FOAM
screen.SKY = CLOUDS CLOUD_COVERAGE CLOUD_SIZE CLOUD_HEIGHT LIGHT_SHAFTS LIGHT_SHAFT_STRENGTH FOG_DENSITY VALLEY_MIST LOW_HAZE FAR_HAZE
screen.POST = BLOOM BLOOM_STRENGTH LENS_FLARE LENS_FLARE_STRENGTH EXPOSURE SATURATION WARMTH FXAA
screen.DEBUG = DEBUG_VIEW
sliders = shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation SSAO_STRENGTH BLOCK_LIGHT_WARMTH AMBIENT_MIN WIND_STRENGTH WATER_WAVE_STRENGTH WATER_CLARITY CLOUD_COVERAGE CLOUD_SIZE CLOUD_HEIGHT LIGHT_SHAFT_STRENGTH FOG_DENSITY LOW_HAZE FAR_HAZE BLOOM_STRENGTH LENS_FLARE_STRENGTH EXPOSURE SATURATION WARMTH
