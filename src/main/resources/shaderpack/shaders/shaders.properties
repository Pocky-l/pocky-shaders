# Pocky Shaders - pack settings for Iris.

# Vanilla features the pack replaces or does not want.
clouds = off
sun = true
moon = true
oldLighting = false
oldHandLight = false
underwaterOverlay = false
vignette = false
separateAo = true
dynamicHandLight = true
rain.depth = false
beacon.beam.depth = true
particles.before.deferred = false
frustum.culling = true

shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true
shadowPlayer = true
dhShadow.enabled = false

# Translucent terrain: premultiplied colour into colortex3; colortex4 only keeps water pixels (alpha 1).
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.dh_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Opaque programs fully replace their gbuffer data.
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.dh_terrain = off

# Quality presets (the Profile button in the shader options).
profile.LOW = QUALITY=0 shadowMapResolution=1024 shadowDistance=64.0 !SSAO !COLORED_SHADOWS !LIGHT_SHAFTS !FOLIAGE_TRANSLUCENCY CLOUDS=1 WATER_REFLECTIONS=1 !VALLEY_MIST
profile.MEDIUM = QUALITY=1 shadowMapResolution=2048 shadowDistance=128.0 SSAO COLORED_SHADOWS LIGHT_SHAFTS FOLIAGE_TRANSLUCENCY CLOUDS=2 WATER_REFLECTIONS=2 VALLEY_MIST
profile.HIGH = QUALITY=2 shadowMapResolution=3072 shadowDistance=160.0 SSAO COLORED_SHADOWS LIGHT_SHAFTS FOLIAGE_TRANSLUCENCY CLOUDS=2 WATER_REFLECTIONS=2 VALLEY_MIST
profile.ULTRA = QUALITY=3 shadowMapResolution=4096 shadowDistance=256.0 SSAO COLORED_SHADOWS LIGHT_SHAFTS FOLIAGE_TRANSLUCENCY CLOUDS=2 WATER_REFLECTIONS=2 VALLEY_MIST

# Option menu.
screen = <profile> QUALITY <empty> <empty> [LIGHTING] [NATURE] [WATER] [SKY] [POST]
screen.LIGHTING = SHADOWS COLORED_SHADOWS shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation SSAO SSAO_STRENGTH HANDHELD_LIGHT BLOCK_LIGHT_WARMTH AMBIENT_MIN
screen.NATURE = WAVING_PLANTS WAVING_LEAVES WIND_STRENGTH FOLIAGE_TRANSLUCENCY WET_SURFACES
screen.WATER = WATER_REFLECTIONS WATER_REFRACTION WATER_WAVE_STRENGTH WATER_CLARITY
screen.SKY = CLOUDS CLOUD_COVERAGE LIGHT_SHAFTS LIGHT_SHAFT_STRENGTH FOG_DENSITY VALLEY_MIST
screen.POST = BLOOM BLOOM_STRENGTH EXPOSURE SATURATION WARMTH FXAA
sliders = shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation SSAO_STRENGTH BLOCK_LIGHT_WARMTH AMBIENT_MIN WIND_STRENGTH WATER_WAVE_STRENGTH WATER_CLARITY CLOUD_COVERAGE LIGHT_SHAFT_STRENGTH FOG_DENSITY BLOOM_STRENGTH EXPOSURE SATURATION WARMTH
